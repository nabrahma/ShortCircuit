# Full stack for real operation. Requires a populated .env at the repo root.
#   docker compose -f deploy/docker-compose.yml up -d
name: shortcircuit

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS must be set in .env}
      POSTGRES_DB: ${DB_NAME:-shortcircuit_trading}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: ../.env          # injected at run time, never baked into the image
    environment:
      DB_HOST: postgres
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
      - ../reports:/app/reports
    stop_grace_period: 45s     # allow the EOD square-off and cleanup to finish

volumes:
  pgdata:
