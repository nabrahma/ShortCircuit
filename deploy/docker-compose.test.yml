# Containerised test run. Requires NO credentials.
#   docker compose -f deploy/docker-compose.test.yml up --exit-code-from tests
name: shortcircuit-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortcircuit_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data     # ephemeral; nothing persists between runs

  tests:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: shortcircuit_test
      DB_PORT: "5432"
      PYTHONPATH: /app/src
    # Test tooling is baked into the image, so nothing is installed at run
    # time — /opt/venv is root-owned and the runtime user cannot write to it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - pytest tests/unit tests/property -v --cov=shortcircuit --cov-report=term
