name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: mypy (advisory)
        run: mypy . --ignore-missing-imports
        continue-on-error: true

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit and property tests
        run: |
          pytest tests/unit tests/property -v \
            --cov=strategy --cov=capital_manager --cov=rest_limiter \
            --cov=symbols --cov=market_utils \
            --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shortcircuit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d shortcircuit_test -v ON_ERROR_STOP=0 -f "$f" || true
          done
      - name: Integration tests
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: shortcircuit_test
          DB_PORT: "5432"
        run: pytest tests/integration -v -m integration

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build image
        run: docker build -f deploy/Dockerfile -t shortcircuit:ci .
      - name: Assert no .env baked into the image
        run: |
          if docker run --rm --entrypoint sh shortcircuit:ci -c 'find / -name ".env" -not -path "*/node_modules/*" 2>/dev/null' | grep -q .; then
            echo "::error::.env found inside the image"; exit 1
          fi
          echo "no .env in image"
      - name: Containerised test run (no credentials)
        run: docker compose -f deploy/docker-compose.test.yml up --exit-code-from tests
