name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # A tag that disagrees with the package version publishes an image and a
      # release that report two different versions. Refuse it.
      - name: Tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"${version}\"" pyproject.toml \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml"; exit 1; }
          grep -qx "__version__ = \"${version}\"" src/shortcircuit/__init__.py \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match shortcircuit.__version__"; exit 1; }

      # The body of the release is the version's CHANGELOG section, so the notes
      # are written once, reviewed in the diff, and cannot drift from the file.
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/            { exit }
            found                        { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md \
            || { echo "::error::CHANGELOG.md has no section for ${version}"; exit 1; }

      # Image references must be lower case; the repository name is not.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Dependency audit report
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc > pip-audit-report.txt || true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: pip-audit-report.txt
